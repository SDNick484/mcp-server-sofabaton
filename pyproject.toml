[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-sofabaton"
version = "0.1.0"
description = "MCP server for Sofabaton X1/X1S/X2 hubs, via sofabaton-x-server's control API (never its write API)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "sofabaton", "universal-remote", "home-automation", "mqtt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
# Runtime needs only HTTP. The sofabaton-x library is a test dependency, to
# check our copy of its button codes.
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-sofabaton"
Issues = "https://github.com/SDNick484/mcp-server-sofabaton/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "sofabaton-x>=0.2.3,<0.3", "httpx2"]

[project.scripts]
mcp-server-sofabaton = "sofabaton_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true
