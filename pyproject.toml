[build-system]
requires = ["setuptools>=77"]  # 77: SPDX `license` strings (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-sofabaton"
dynamic = ["version"]  # from sofabaton_mcp.__version__ (below)
description = "MCP server for Sofabaton universal remote hubs: an X2 over its own MQTT link, or any model via sofabaton-x-server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "sofabaton", "universal-remote", "home-automation", "mqtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
# The sofabaton-x library is a test dependency, to check our copy of its button codes.
dependencies = [
    "mcp>=2.3,<3",
    # X2 MQTT. aiomqtt is the asyncio wrapper around paho-mqtt (Eclipse), the most widely
    # used Python MQTT client; both are pure Python and pull in nothing else. A required
    # dependency since 0.2.1: MQTT is the path most people use, and an X1/X1S carries it unused.
    "aiomqtt>=2.3,<3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-sofabaton"
Issues = "https://github.com/SDNick484/mcp-server-sofabaton/issues"
Changelog = "https://github.com/SDNick484/mcp-server-sofabaton/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Empty since 0.2.1 (aiomqtt is a regular dependency); kept so `[mqtt]` in existing
# install commands still resolves.
mqtt = []
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "sofabaton-x>=0.2.3,<0.3", "httpx2"]

[project.scripts]
mcp-server-sofabaton = "sofabaton_mcp.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sofabaton_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sofabaton_mcp.sim" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true
